version: "3.8"

services:

  mongo:
    image: mongo:7
    container_name: mongo-btg
    ports:
      - "27017:27017"

  app:
    build:
      context: /home/julian-martinez/Documentos/java/BtgFondosMS
      dockerfile: Dockerfile
    container_name: btg-ms
    depends_on:
      - mongo
    ports:
      - "8080:8080"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/BTG
